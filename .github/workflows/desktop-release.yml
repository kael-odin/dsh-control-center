name: desktop-release

# Build the desktop installers for all three platforms and attach them to the
# release for the pushed tag. macOS must run on macOS runners; Windows NSIS and
# Linux AppImage/deb build on their native runners. `workflow_dispatch` allows
# backfilling an existing tag's release (pass the tag as input).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach artifacts to (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # DSH Control Center x.y.z x64-setup.exe
            script: dist:win
          - os: ubuntu-latest    # AppImage + deb (x64)
            script: dist:linux
          - os: macos-latest     # dmg (Apple silicon)
            script: dist:mac
          - os: macos-13         # dmg (Intel x64)
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm run ${{ matrix.script }}
        env:
          # Unsigned builds: electron-builder skips signing cleanly on all OSes.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage release/*.deb release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

name: desktop-release

# Build the desktop installers for all three platforms and attach them to the
# release for the pushed tag. macOS must run on macOS runners; it builds BOTH
# architectures from one arm64 runner (unsigned, so cross-arch is fine) — the
# retired macos-13 Intel label queues forever. `workflow_dispatch` allows
# backfilling an existing tag's release (pass the tag as input).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach artifacts to (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # DSH Control Center x.y.z x64-setup.exe
            script: dist:win
          - os: ubuntu-latest    # AppImage + deb (x64)
            script: dist:linux
          - os: macos-latest     # dmg (x64 + arm64, unsigned cross-build)
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      # One root install: apps/desktop is a workspace member, so its devDeps
      # (electron with the downloaded binary, electron-builder) land via the
      # shared lockfile.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build and bundle the Control Center plugin
        run: pnpm run build
      - name: Prepare bundle artifacts for the shell
        run: |
          cd apps/desktop/vendor
          TARBALL=$(ls dsh-control-center-bundle-*.tgz | head -1)
          # The packed filename carries the version — stamp it for the shell's
          # auto-sync version comparison.
          VERSION=$(echo "$TARBALL" | sed -E 's/.*-([0-9][^-]*)\.tgz/\1/')
          printf '{"version":"%s"}' "$VERSION" > bundle-version.json
          mv "$TARBALL" bundle.tgz
          echo "bundled plugin version: $VERSION"

      - name: Build installers
        working-directory: apps/desktop
        run: pnpm run ${{ matrix.script }}
        env:
          # Unsigned builds: electron-builder skips signing cleanly on all OSes.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage release/*.deb release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

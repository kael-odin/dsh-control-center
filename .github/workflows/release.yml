name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Pack the bundle
        run: pnpm --filter @dsh-control-center/bundle pack --out ../dsh-control-center-bundle.tgz
        working-directory: packages/bundle

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dsh-control-center-bundle.tgz \
            --title "DSH Control Center $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --draft

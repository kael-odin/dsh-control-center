name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tests compose overlay patches from and alias typert-protocol to the
      # sibling harness checkout (vitest.config.ts ../deepseek-harness).
      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          fetch-depth: 0
          # First ref carrying packages/bundle/base/cordis.patch.yml (the
          # npm-public merge; the rc.7 baseline predates the overlay files).
          ref: 47f943859b

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Pack the bundle
        run: pnpm --filter @dsh-control-center/bundle pack --out ../dsh-control-center-bundle.tgz
        working-directory: packages/bundle

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dsh-control-center-bundle.tgz \
            --title "DSH Control Center $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --draft

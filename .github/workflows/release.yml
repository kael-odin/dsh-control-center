name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The runner workspace is named after this repo, so the repo itself is
      # checked out into a control-center/ subdir and the harness lands as its
      # SIBLING (../deepseek-harness) — exactly the layout the tests and the
      # vitest typert-protocol alias expect.
      - uses: actions/checkout@v4
        with:
          path: control-center
          fetch-depth: 0

      # The rc.7 baseline predates the bundle overlay files; the first ref
      # carrying them is the npm-public merge, so checkout main and detach.
      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          fetch-depth: 0

      - name: Detach harness to the npm-public merge
        working-directory: deepseek-harness
        run: git checkout 47f943859b

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Pack the bundle
        run: pnpm --filter @dsh-control-center/bundle pack --out ../dsh-control-center-bundle.tgz
        working-directory: packages/bundle

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dsh-control-center-bundle.tgz \
            --title "DSH Control Center $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --draft
